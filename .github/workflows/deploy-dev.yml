name: Deploy to Dev (EC2)

on:
  push:
    branches: [develop]

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 설정 ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle 빌드 (테스트 제외) ─────────────────────────────────
      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon -x test

      # ── 4. Docker Hub 로그인 ─────────────────────────────────────────
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ── 5. Docker 이미지 빌드 & 푸시 ─────────────────────────────────
      - name: Build, tag, and push image to Docker Hub
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/${{ secrets.DOCKERHUB_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $IMAGE_NAME:$IMAGE_TAG .
          docker tag $IMAGE_NAME:$IMAGE_TAG $IMAGE_NAME:latest
          docker push $IMAGE_NAME:$IMAGE_TAG
          docker push $IMAGE_NAME:latest
          echo "DOCKER_IMAGE=$IMAGE_NAME:$IMAGE_TAG" >> $GITHUB_ENV

      # ── 6. EC2 배포 ──────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: DOCKER_IMAGE
          script: |
            # Docker Hub 로그인 (private 리포지토리 pull용)
            echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login --username "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

            # 앱 런타임 환경변수 파일 동기화 (GitHub Secret ENV_FILE 전체 내용을 그대로 기록)
            mkdir -p /home/ubuntu/app
            cat > /home/ubuntu/app/.env << 'ENVEOF'
            ${{ secrets.ENV_FILE }}
            ENVEOF

            # 이미지 pull
            docker pull $DOCKER_IMAGE

            # 기존 컨테이너 교체
            docker stop officemeong-app || true
            docker rm officemeong-app || true

            # 새 컨테이너 실행 (EC2 .env 파일에서 시크릿 로드)
            docker run -d \
              --name officemeong-app \
              --env-file /home/ubuntu/app/.env \
              -p 8080:8080 \
              --restart always \
              $DOCKER_IMAGE

            # 사용하지 않는 이미지 정리
            docker image prune -f
