name: Deploy to Dev (EC2)

on:
  push:
    branches: [develop]

env:
  AWS_REGION: ap-northeast-2

jobs:
  deploy:
    name: Build & Deploy
    runs-on: ubuntu-latest

    steps:
      # ── 1. 소스 체크아웃 ─────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4

      # ── 2. Java 17 설정 ──────────────────────────────────────────────
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # ── 3. Gradle 빌드 (테스트 제외) ─────────────────────────────────
      - name: Build with Gradle
        run: ./gradlew bootJar --no-daemon -x test

      # ── 4. AWS 자격증명 설정 ─────────────────────────────────────────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # ── 5. ECR 로그인 ────────────────────────────────────────────────
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # ── 6. Docker 이미지 빌드 & 푸시 ─────────────────────────────────
      - name: Build, tag, and push image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: ${{ secrets.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "ECR_IMAGE=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_ENV

      # ── 7. EC2 배포 ──────────────────────────────────────────────────
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          envs: ECR_IMAGE
          script: |
            # ECR 로그인
            aws ecr get-login-password --region ap-northeast-2 | \
              docker login --username AWS --password-stdin \
              $(echo $ECR_IMAGE | cut -d'/' -f1)

            # 이미지 pull
            docker pull $ECR_IMAGE

            # 기존 컨테이너 교체
            docker stop officemeong-app || true
            docker rm officemeong-app || true

            # 새 컨테이너 실행 (EC2 .env 파일에서 시크릿 로드)
            docker run -d \
              --name officemeong-app \
              --env-file /home/ec2-user/app/.env \
              -p 8080:8080 \
              --restart always \
              $ECR_IMAGE

            # 사용하지 않는 이미지 정리
            docker image prune -f
