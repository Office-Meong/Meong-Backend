## EC2 dev 서버용 (앱만, DB는 AWS RDS)
## EC2에서 사용: docker-compose -f docker-compose.dev.yml up -d
## .env 파일을 같은 디렉토리에 두거나 환경변수 주입

services:
  app:
    image: ${DOCKER_IMAGE}
    container_name: officemeong-app
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: ${DB_URL}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      KTO_SERVICE_KEY: ${KTO_SERVICE_KEY}
      KAKAO_CLIENT_ID: ${KAKAO_CLIENT_ID}
      KAKAO_REDIRECT_URI: ${KAKAO_REDIRECT_URI}
      JWT_SECRET: ${JWT_SECRET}
      ADMIN_API_KEY: ${ADMIN_API_KEY}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME}
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-ap-northeast-2}
      # TERMS_URL / PRIVACY_URL / INQUIRY_URL: 미설정 시 application.yml의 플레이스홀더 기본값 사용
    restart: always
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
