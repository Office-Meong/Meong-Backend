spring:
  application:
    name: OfficeMeong
  datasource:
    url: jdbc:mariadb://localhost:3306/officemeong?characterEncoding=UTF-8&serverTimezone=Asia/Seoul
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:}
    driver-class-name: org.mariadb.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      connection-timeout: 5000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        dialect: org.hibernate.dialect.MariaDBDialect
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

server:
  port: 8080
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

api:
  kto:
    service-key: ${KTO_SERVICE_KEY}
    base-url: https://apis.data.go.kr/B551011
    mobile-os: ETC
    mobile-app: OfficeMeong
  gwto:
    base-url: https://www.pettravel.kr/api

logging:
  level:
    com.officemeong: DEBUG
    org.springframework.batch: INFO
