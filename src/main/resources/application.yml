spring:
  application:
    name: OfficeMeong

  # 프로필 미지정 시 로컬 개발 기본값. 배포 환경은 항상 SPRING_PROFILES_ACTIVE로 명시적으로 덮어씀
  profiles:
    active: local

  # 공통 JPA 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Batch 자동 실행 비활성화 (배치는 API 트리거로만 실행)
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  # Servlet 인코딩
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080
  forward-headers-strategy: native

# 카카오 OAuth
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  client-secret: ${KAKAO_CLIENT_SECRET:}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000     # 30분 (ms)
  refresh-token-expiry: 1209600000 # 14일 (ms)

# OpenAI GPT API
openai:
  api-key: ${OPENAI_API_KEY:}

# 앱 정책/문의 링크 (플레이스홀더 — 실제 URL 확정 후 환경변수로 교체 필요)
app:
  policy:
    terms-url: ${TERMS_URL:https://officemeong.example.com/terms}
    privacy-url: ${PRIVACY_URL:https://officemeong.example.com/privacy}
    inquiry-url: ${INQUIRY_URL:https://officemeong.example.com/inquiry}

# 관리자 배치 수동 실행 API 인증 키 (X-Admin-Key 헤더)
admin:
  api-key: ${ADMIN_API_KEY:}

# 외부 API 설정
api:
  kto:
    service-key: ${KTO_SERVICE_KEY}
    base-url: https://apis.data.go.kr/B551011
    mobile-os: ETC
    mobile-app: OfficeMeong
  gwto:
    base-url: https://www.pettravel.kr/api

# AWS S3 (이미지 업로드)
cloud:
  aws:
    s3:
      bucket: ${S3_BUCKET_NAME}
      region: ${AWS_REGION:ap-northeast-2}
      access-key: ${AWS_ACCESS_KEY_ID}
      secret-key: ${AWS_SECRET_ACCESS_KEY}

# Swagger UI
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs

# 로깅
logging:
  level:
    com.officemeong: INFO
