spring:
  application:
    name: OfficeMeong

  # 공통 JPA 설정
  jpa:
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100

  # Batch 자동 실행 비활성화 (배치는 API 트리거로만 실행)
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: always

  # Servlet 인코딩
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

server:
  port: 8080

# 카카오 OAuth
kakao:
  client-id: ${KAKAO_CLIENT_ID}
  redirect-uri: ${KAKAO_REDIRECT_URI}

# JWT
jwt:
  secret: ${JWT_SECRET}
  access-token-expiry: 1800000     # 30분 (ms)
  refresh-token-expiry: 1209600000 # 14일 (ms)

# 외부 API 설정
api:
  kto:
    service-key: ${KTO_SERVICE_KEY}
    base-url: https://apis.data.go.kr/B551011
    mobile-os: ETC
    mobile-app: OfficeMeong
  gwto:
    base-url: https://www.pettravel.kr/api

# 로깅
logging:
  level:
    com.officemeong: INFO
